<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>焼肉 誠 公式アプリ</title>
<style>
:root{
  --bg:#0f0d0a; --panel:#1a1712; --panel2:#26211a; --line:#3a332a;
  --gold:#c9a45c; --gold2:#e8cd8f; --text:#f2ece0; --muted:#9a8f7a;
  --red:#c0392b; --ember:#d35400; --green:#4caf7d;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
body{background:#080705;color:var(--text);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit;font-size:15px;width:100%;padding:10px 12px;border-radius:8px;
  border:1px solid var(--line);background:var(--panel2);color:var(--text)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
a{color:var(--gold2)}
h1,h2,h3{font-weight:600}

/* ===== 共通部品 ===== */
.btn{display:inline-block;padding:11px 18px;border-radius:8px;font-size:14px;font-weight:600;
  background:linear-gradient(135deg,var(--gold),#a9823f);color:#1a1206;letter-spacing:.05em}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;border:1px solid var(--gold);color:var(--gold2)}
.btn.danger{background:transparent;border:1px solid var(--red);color:#e07b6d}
.btn.small{padding:6px 12px;font-size:12px}
.btn.block{display:block;width:100%;text-align:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--gold);color:var(--gold2)}
.tag.red{border-color:var(--red);color:#e07b6d}
.tag.green{border-color:var(--green);color:#7fd4a8}
.muted{color:var(--muted);font-size:12px}
.row{display:flex;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec-title{font-size:14px;color:var(--gold2);letter-spacing:.15em;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line)}

/* ===== 認証画面 ===== */
.auth-wrap{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 22px;
  background:radial-gradient(circle at 50% 0%,#241a10 0%,#080705 60%)}
.logo{text-align:center;margin-bottom:26px}
.logo .mark{font-size:44px}
.logo h1{font-size:26px;letter-spacing:.35em;color:var(--gold2);margin-top:6px}
.logo p{color:var(--muted);font-size:12px;letter-spacing:.2em;margin-top:4px}
.auth-tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:8px}
.auth-tabs button{flex:1;background:none;color:var(--muted);padding:12px;font-size:14px;border-bottom:2px solid transparent}
.auth-tabs button.on{color:var(--gold2);border-bottom-color:var(--gold)}

/* ===== お客様アプリ（スマホ枠） ===== */
.phone{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;
  box-shadow:0 0 60px rgba(0,0,0,.8)}
.app-header{position:sticky;top:0;z-index:20;background:rgba(15,13,10,.95);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.app-header .ttl{font-size:16px;letter-spacing:.25em;color:var(--gold2)}
.bell{position:relative;background:none;font-size:20px}
.bell .cnt{position:absolute;top:-6px;right:-8px;background:var(--red);color:#fff;font-size:10px;
  border-radius:99px;padding:1px 5px;min-width:16px;text-align:center}
.app-body{padding:16px 16px 90px}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:30;
  display:flex;background:#14110c;border-top:1px solid var(--line)}
.bottom-nav button{flex:1;background:none;color:var(--muted);padding:9px 0 10px;font-size:10px;display:flex;
  flex-direction:column;align-items:center;gap:3px}
.bottom-nav button .ic{font-size:20px}
.bottom-nav button.on{color:var(--gold2)}

/* ホーム */
.hero{border-radius:16px;overflow:hidden;border:1px solid var(--gold);margin-bottom:16px;
  background:linear-gradient(135deg,#3b1d0d 0%,#1c0f07 70%);padding:22px 18px;position:relative}
.hero .tag{margin-bottom:10px}
.hero h2{font-size:19px;line-height:1.5;color:var(--gold2)}
.hero p{font-size:13px;color:var(--text);margin-top:8px;line-height:1.7}
.menu-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.menu-scroll::-webkit-scrollbar{display:none}
.m-card{min-width:130px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;flex-shrink:0}
.m-card .ph{height:80px;display:flex;align-items:center;justify-content:center;font-size:34px;
  background:linear-gradient(135deg,#33241a,#1c140d)}
.m-card .bd{padding:8px 10px}
.m-card .nm{font-size:12px;line-height:1.4}
.m-card .pr{font-size:13px;color:var(--gold2);margin-top:2px}

/* 店舗 */
.store-card{overflow:hidden;padding:0}
.store-card .ph{height:110px;display:flex;align-items:flex-end;padding:12px 16px;font-size:17px;letter-spacing:.1em;
  color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.store-card .bd{padding:14px 16px}
.fav-btn{background:none;font-size:22px}
.info-tbl{width:100%;font-size:13px;border-collapse:collapse}
.info-tbl th{color:var(--muted);font-weight:400;text-align:left;padding:7px 10px 7px 0;width:82px;vertical-align:top;white-space:nowrap}
.info-tbl td{padding:7px 0;line-height:1.6}
.cat-tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tabs button{white-space:nowrap;background:var(--panel2);color:var(--muted);border:1px solid var(--line);
  border-radius:99px;padding:7px 14px;font-size:12px}
.cat-tabs button.on{background:var(--gold);color:#1a1206;border-color:var(--gold);font-weight:600}
.menu-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.menu-row .ph{width:56px;height:56px;border-radius:10px;background:linear-gradient(135deg,#33241a,#1c140d);
  display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.menu-row .nm{font-size:14px}
.menu-row .ds{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5}
.menu-row .pr{margin-left:auto;color:var(--gold2);font-size:14px;white-space:nowrap}
.rank-num{display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#1a1206;
  font-size:12px;font-weight:700;text-align:center;line-height:20px;margin-right:6px}

/* クーポン */
.coupon{border:1px dashed var(--gold);border-radius:14px;background:linear-gradient(135deg,#241c10,#171209);
  padding:16px;margin-bottom:12px;position:relative}
.coupon.used{opacity:.45;border-color:var(--line)}
.coupon .bene{font-size:19px;color:var(--gold2);font-weight:700;margin:4px 0}
.coupon .cond{font-size:11px;color:var(--muted);line-height:1.6}
.coupon .exp{font-size:11px;color:#e07b6d;margin-top:6px}

/* スタンプ */
.stamp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0}
.stamp{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;
  justify-content:center;font-size:22px;color:var(--line)}
.stamp.on{border:2px solid var(--gold);background:radial-gradient(circle,#3b2c15,#241c10);color:var(--gold2)}
.point-big{font-size:34px;color:var(--gold2);font-weight:700}

/* リスト */
.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}
.list-item:last-child{border-bottom:none}

/* ===== モーダル・トースト ===== */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;
  justify-content:center;padding:20px}
.modal{background:var(--panel);border:1px solid var(--gold);border-radius:16px;padding:22px;width:100%;
  max-width:400px;max-height:86vh;overflow-y:auto}
.modal h3{color:var(--gold2);margin-bottom:12px;font-size:16px}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--gold);color:#1a1206;
  padding:11px 22px;border-radius:99px;font-size:13px;font-weight:600;z-index:200;opacity:0;transition:opacity .3s;
  pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.5)}
#toast.show{opacity:1}

/* ===== 管理画面 ===== */
.admin{display:flex;min-height:100vh;background:var(--bg)}
.side{width:210px;background:#14110c;border-right:1px solid var(--line);padding:20px 0;flex-shrink:0}
.side .lg{padding:0 20px 18px;border-bottom:1px solid var(--line);margin-bottom:12px}
.side .lg b{color:var(--gold2);letter-spacing:.15em;font-size:15px}
.side .lg div{font-size:11px;color:var(--muted);margin-top:4px}
.side button{display:block;width:100%;text-align:left;background:none;color:var(--muted);padding:11px 20px;font-size:13px}
.side button.on{color:var(--gold2);background:var(--panel2);border-right:3px solid var(--gold)}
.side .lo{margin-top:20px;color:#e07b6d}
.main{flex:1;padding:26px;max-width:1100px;min-width:0}
.main h2{color:var(--gold2);letter-spacing:.1em;font-size:19px;margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .lb{font-size:11px;color:var(--muted)}
.kpi .vl{font-size:26px;color:var(--gold2);font-weight:700;margin-top:4px}
.kpi .vl small{font-size:12px;color:var(--muted);font-weight:400}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.bar-row{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12px}
.bar-row .lb{width:88px;color:var(--muted);text-align:right;flex-shrink:0}
.bar-row .tr{flex:1;background:var(--panel2);border-radius:4px;height:18px;overflow:hidden}
.bar-row .br{height:100%;background:linear-gradient(90deg,#a9823f,var(--gold));border-radius:4px;min-width:2px}
.bar-row .vl{width:38px;color:var(--gold2);flex-shrink:0}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--muted);font-weight:400;font-size:11px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl-wrap{overflow-x:auto}
@media(max-width:760px){
  .admin{flex-direction:column}
  .side{width:100%;display:flex;overflow-x:auto;padding:0;border-right:none;border-bottom:1px solid var(--line);align-items:center}
  .side .lg{border:none;margin:0;padding:12px 16px;white-space:nowrap}
  .side .lg div{display:none}
  .side button{width:auto;white-space:nowrap;padding:14px 12px}
  .side button.on{border-right:none;border-bottom:2px solid var(--gold)}
  .main{padding:16px}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";
/* =====================================================
   焼肉 誠 公式アプリ（localStorage プロトタイプ版）
   お客様アプリ + 管理画面を1ファイルで動作させるSPA
   ===================================================== */
const DB_KEY = "yakiniku_makoto_v1";
let db = null;

/* ---------- 共通ヘルパー ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let _uid = 1000;
const uid = p => p + "_" + Date.now().toString(36) + (_uid++).toString(36);
const WD = ["日","月","火","水","木","金","土"];
function d2s(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function todayStr(){ return d2s(new Date()); }
function addDaysStr(base, n){ const d = new Date(base + "T00:00:00"); d.setDate(d.getDate()+n); return d2s(d); }
function fmtD(s){ if(!s) return "-"; const d = new Date(s + "T00:00:00"); return (d.getMonth()+1) + "/" + d.getDate() + "(" + WD[d.getDay()] + ")"; }
function daysBetween(a, b){ return Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00")) / 86400000); }
function yen(n){ return "¥" + Number(n).toLocaleString(); }
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._tm); t._tm = setTimeout(()=>t.classList.remove("show"), 2400); }
function modal(html){ closeModal(); const bg = document.createElement("div"); bg.className = "modal-bg"; bg.id = "modalBg";
  bg.innerHTML = `<div class="modal">${html}</div>`;
  bg.addEventListener("click", e => { if(e.target === bg) closeModal(); });
  document.body.appendChild(bg); }
function closeModal(){ const m = $("#modalBg"); if(m) m.remove(); }

function loadDB(){
  try{ const raw = localStorage.getItem(DB_KEY); if(raw){ db = JSON.parse(raw); return; } }catch(e){}
  db = seed(); saveDB();
}
function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }

  resEdit:null, resPrefStore:null, adResDate:todayStr() };
function me(){ return db.session ? db.users.find(u => u.id === db.session.userId) : null; }
function store(id){ return db.stores.find(s => s.id === id); }
function coupon(id){ return db.coupons.find(c => c.id === id); }

/* ---------- クーポン発行・共通ロジック ---------- */
function issueCoupon(userId, couponId){
  const c = coupon(couponId); if(!c) return;
  db.userCoupons.push({ id:uid("uc"), userId, couponId, gotAt:todayStr(),
    expireAt:addDaysStr(todayStr(), c.days || 30), used:false, usedAt:null });
}
function pushMsg(title, body){
  const id = (db.pushes.reduce((m,p)=>Math.max(m,p.id),0)) + 1;
  db.pushes.unshift({ id, title, body, date:todayStr() });
}
function lastVisitOf(userId){
  const vs = db.visits.filter(v => v.userId === userId).sort((a,b)=>b.date.localeCompare(a.date));
  return vs.length ? vs[0].date : null;
}
/* 来店処理：来店1回=1スタンプ、100円=1ポイント、10スタンプで1,000円OFFクーポン */
function recordVisit(userId, storeId, dateStr, time, amount){
  const u = db.users.find(x => x.id === userId); if(!u) return;
  db.visits.push({ id:uid("v"), userId, storeId, date:dateStr, time, amount });
  const pt = Math.floor(amount / 100);
  u.points = (u.points || 0) + pt;
  db.points.push({ id:uid("p"), userId, delta:pt, reason:"来店ポイント（" + store(storeId).name + "）", date:dateStr });
  u.stamps = (u.stamps || 0) + 1;
  let stampCoupon = false;
  if(u.stamps >= 10){ u.stamps -= 10; issueCoupon(userId, "c3"); stampCoupon = true; }
  saveDB();
  return { pt, stampCoupon };
}
/* 誕生日月チェック（ログイン時） */
function checkBirthday(u){
  if(!u.birth) return;
  const now = new Date();
  if(Number(u.birth.slice(5,7)) === now.getMonth() + 1 && u.bdayYear !== now.getFullYear()){
    u.bdayYear = now.getFullYear();
    issueCoupon(u.id, "c2");
    saveDB();
    setTimeout(()=>toast("🎂 バースデークーポンが届きました！"), 600);
  }
}

window.submitReservation = (editId) => {
  const u = me();
  const date = $("#rsDate").value, name = $("#rsName").value.trim(), phone = $("#rsPhone").value.trim();
  if(!date){ toast("日付を選択してください"); return; }
  if(date < todayStr()){ toast("過去の日付は選択できません"); return; }
  if(!name || !phone){ toast("お名前と電話番号を入力してください"); return; }
  const data = { storeId:$("#rsStore").value, date, time:$("#rsTime").value,
    people:Number($("#rsPeople").value), seat:$("#rsSeat").value, course:$("#rsCourse").value,
    name, phone, note:$("#rsNote").value.trim() };
  if(editId){
    Object.assign(db.reservations.find(r => r.id === editId), data);

/* ---------- クーポン ---------- */
function cCoupons(){
  const u = me(); const today = todayStr();
  const mine = db.userCoupons.filter(c => c.userId === u.id).sort((a,b)=>Number(a.used)-Number(b.used) || b.gotAt.localeCompare(a.gotAt));
  const held = new Set(mine.filter(c => !c.used && c.expireAt >= today).map(c => c.couponId));
  const claimable = db.coupons.filter(c => c.type === "public" && c.active && !held.has(c.id));
  return `
    <h2 style="font-size:17px;letter-spacing:.1em;margin-bottom:14px">クーポン</h2>
    ${claimable.length ? `<div class="sec-title">受け取れるクーポン</div>
      ${claimable.map(c => `
        <div class="coupon">
          <span class="tag">配布中</span>
          <div class="bene">${esc(c.benefit)}</div>
          <b style="font-size:13px">${esc(c.title)}</b>
          <p class="cond" style="margin-top:4px">${esc(c.cond)}</p>
          <div style="margin-top:12px"><button class="btn small" onclick="claimCoupon('${c.id}')">クーポンを受け取る</button></div>
        </div>`).join("")}` : ""}
    <div class="sec-title">保有クーポン</div>
    ${mine.length ? mine.map(ucRow).join("") : `<p class="muted">保有クーポンはありません。「受け取れるクーポン」からゲットしてください！</p>`}
  `;
}
function ucRow(uc){
  const c = coupon(uc.couponId); const today = todayStr();
  const expired = !uc.used && uc.expireAt < today;
  return `
    <div class="coupon ${uc.used || expired ? "used" : ""}">
      <div class="row between">
        <b style="font-size:13px">${esc(c.title)}</b>
        ${uc.used ? `<span class="tag">利用済み</span>` : expired ? `<span class="tag red">期限切れ</span>` : ""}
      </div>
      <div class="bene">${esc(c.benefit)}</div>
      <p class="cond">${esc(c.cond)}</p>
      <p class="exp">有効期限：${fmtD(uc.expireAt)} まで</p>
      ${!uc.used && !expired ? `<div style="margin-top:12px"><button class="btn small" onclick="useCoupon('${uc.id}')">お店で使う</button></div>` : ""}
    </div>`;
}
window.claimCoupon = cid => {
  issueCoupon(me().id, cid); saveDB();
  toast("クーポンを受け取りました！"); render();
};
window.useCoupon = ucId => {
  const uc = db.userCoupons.find(x => x.id === ucId); const c = coupon(uc.couponId);
  modal(`<h3>🎫 クーポン利用</h3>

function barChart(title, rows, unit){
  const max = Math.max(...rows.map(r => r.value), 1);
  return `<div class="card"><b style="font-size:13px;color:var(--gold2)">${title}</b>
    <div style="margin-top:10px">
    ${rows.map(r => `
      <div class="bar-row">
        <span class="lb">${esc(r.label)}</span>
        <div class="tr"><div class="br" style="width:${Math.round(r.value/max*100)}%"></div></div>
        <span class="vl">${r.value.toLocaleString()}${unit||""}</span>
      </div>`).join("")}
    </div></div>`;
}

/* ---------- ダッシュボード（マーケティング分析） ---------- */
function aDash(){
  const today = todayStr();
  const thisMonth = today.slice(0,7);
  const customers = db.users.filter(u => u.role === "customer");
  const newMembers = customers.filter(u => (u.createdAt||"").slice(0,7) === thisMonth).length;
  const todaysRes = db.reservations.filter(r => r.date === today && r.status === "confirmed").length;
  const monthVisits = db.visits.filter(v => v.date.slice(0,7) === thisMonth);
  const couponUsed = db.userCoupons.filter(c => c.used).length;
  const repeaters = customers.filter(u => db.visits.filter(v => v.userId === u.id).length >= 2).length;

  const byStore = db.stores.map(s => ({ label:s.name.replace("焼肉 誠 ",""), value:db.visits.filter(v => v.storeId === s.id).length }));
  const salesByStore = db.stores.map(s => ({ label:s.name.replace("焼肉 誠 ",""),
    value: db.visits.filter(v => v.storeId === s.id).reduce((a,v)=>a+v.amount,0) }));
  const byWd = WD.map((w,i) => ({ label:w+"曜", value:db.visits.filter(v => new Date(v.date+"T00:00:00").getDay() === i).length }));
  const byHour = [];
  for(let h = 11; h <= 22; h++){
    const n = db.visits.filter(v => Number(v.time.slice(0,2)) === h).length;
    if(n || (h >= 17 && h <= 21)) byHour.push({ label:h+"時台", value:n });
  }
  const popCoupons = db.coupons.map(c => ({ label:c.title.replace("クーポン",""), value:db.userCoupons.filter(uc => uc.couponId === c.id && uc.used).length }))
    .filter(r => r.value > 0).sort((a,b)=>b.value-a.value);
  const popMenus = db.menus.filter(m => m.pop > 0).sort((a,b)=>a.pop-b.pop).slice(0,5)
    .map((m,i) => ({ label:(i+1)+"位 "+m.name.slice(0,8), value:100 - m.pop*10 }));
  const inactive = customers.map(u => ({ u, last:lastVisitOf(u.id) }))
    .filter(x => x.last && daysBetween(x.last, today) >= 30)
    .sort((a,b)=>a.last.localeCompare(b.last));
  return `
    <h2>マーケティング分析ダッシュボード</h2>
    <div class="kpis">
      <div class="kpi"><div class="lb">アプリ会員数</div><div class="vl">${customers.length}<small> 名</small></div></div>
      <div class="kpi"><div class="lb">今月の新規会員</div><div class="vl">${newMembers}<small> 名</small></div></div>
      <div class="kpi"><div class="lb">本日の予約</div><div class="vl">${todaysRes}<small> 件</small></div></div>
      <div class="kpi"><div class="lb">今月の来店数</div><div class="vl">${monthVisits.length}<small> 回</small></div></div>
      <div class="kpi"><div class="lb">リピーター数（2回以上）</div><div class="vl">${repeaters}<small> 名</small></div></div>
      <div class="kpi"><div class="lb">クーポン利用累計</div><div class="vl">${couponUsed}<small> 枚</small></div></div>
    </div>
    <div class="charts">
      ${barChart("店舗別 来店数（累計）", byStore, "回")}
      ${barChart("店舗別 売上（累計）", salesByStore.map(r => ({label:r.label, value:Math.round(r.value/1000)})), "千円")}
      ${barChart("曜日別 来店数", byWd, "回")}
      ${barChart("時間帯別 来店数", byHour, "回")}
      ${popCoupons.length ? barChart("人気クーポン（利用数）", popCoupons, "枚") : ""}
      ${barChart("人気メニュー（人気度スコア）", popMenus, "")}
    </div>
    <div class="sec-title" style="margin-top:24px">来店が途絶えている顧客（30日以上）</div>
    <div class="card tbl-wrap">
      <table class="tbl">
        <tr><th>顧客名</th><th>お気に入り店舗</th><th>最終来店日</th><th>経過日数</th><th>アクション</th></tr>
        ${inactive.length ? inactive.map(x => `
          <tr>
            <td>${esc(x.u.name)}</td>
            <td>${x.u.favStore ? esc(store(x.u.favStore).name) : "-"}</td>
            <td>${fmtD(x.last)}</td>
            <td><span class="tag ${daysBetween(x.last,today)>=60?'red':''}">${daysBetween(x.last,today)}日</span></td>
            <td><button class="btn small ghost" onclick="setAdminPage('coup')">クーポンを配信</button></td>
          </tr>`).join("") : `<tr><td colspan="5" class="muted">該当する顧客はいません</td></tr>`}
      </table>
    </div>
  `;
}

            <td><b>${r.time}</b></td>
            <td>${esc(store(r.storeId).name.replace("焼肉 誠 ",""))}</td>
            <td>${esc(r.name)}</td>
            <td>${r.people}名</td>
            <td>${esc(r.seat)}</td>
            <td>${esc(r.course||"-")}</td>
            <td>${esc(r.phone)}</td>
            <td class="muted">${esc(r.note||"-")}</td>

    <p class="muted">「来店済みにする」でお会計金額を入力すると、来店履歴の記録・ポイント付与（100円=1pt）・スタンプ付与（+1）が自動で行われます。</p>
  `;
}
window.openVisited = resId => {
  const r = db.reservations.find(x => x.id === resId);
  modal(`<h3>来店済み処理</h3>
    <p style="font-size:13px;line-height:1.8">${esc(r.name)} 様（${fmtD(r.date)} ${r.time}／${esc(store(r.storeId).name)}）</p>
    <label>お会計金額（円）</label>
    <input id="vsAmount" type="number" min="0" step="100" placeholder="例：8000">
    <p class="muted" style="margin-top:8px">100円につき1ポイント付与＋スタンプ1個を押印します。</p>
    <div class="row" style="margin-top:16px">
      <button class="btn" style="flex:1" onclick="confirmVisited('${resId}')">来店済みにする</button>
      <button class="btn ghost" onclick="closeModal()">戻る</button>
    </div>`);
};
window.confirmVisited = resId => {
  const amount = Number($("#vsAmount").value);
  if(!amount || amount <= 0){ toast("お会計金額を入力してください"); return; }
  const r = db.reservations.find(x => x.id === resId);
  r.status = "visited";
  const result = recordVisit(r.userId, r.storeId, r.date, r.time, amount);
  closeModal();
  toast(result && result.stampCoupon ? "来店処理完了！スタンプ10個達成でクーポンを自動発行しました" : "来店済みにしました（ポイント・スタンプ付与済み）");

window.adCancelRes = id => {
  db.reservations.find(r => r.id === id).status = "cancelled";
  saveDB(); toast("予約を取り消しました"); render();
};

/* ---------- 顧客管理 ---------- */
function aCust(){
  const q = state.custQ || "";
  const customers = db.users.filter(u => u.role === "customer")
    .filter(u => !q || u.name.includes(q) || (u.phone||"").includes(q) || (u.email||"").includes(q))
    .sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
  const today = todayStr();
  return `
    <h2>顧客管理</h2>
    <div class="card">
      <input placeholder="🔍 名前・電話番号・メールで検索" value="${esc(q)}" oninput="state.custQ=this.value;render();this.focus();this.setSelectionRange(this.value.length,this.value.length)">
    </div>
    <div class="card tbl-wrap">
      <table class="tbl">
        <tr><th>顧客名</th><th>登録日</th><th>お気に入り</th><th>ポイント</th><th>スタンプ</th><th>来店回数</th><th>最終来店</th><th></th></tr>
        ${customers.map(u => {
          const last = lastVisitOf(u.id);
          const n = db.visits.filter(v => v.userId === u.id).length;
          return `<tr>
            <td><b>${esc(u.name)}</b><div class="muted">${esc(u.email||u.loginId)}</div></td>
            <td>${fmtD(u.createdAt)}</td>
            <td>${u.favStore ? esc(store(u.favStore).name.replace("焼肉 誠 ","")) : "-"}</td>
            <td>${(u.points||0).toLocaleString()}pt</td>
            <td>${u.stamps||0}/10</td>
            <td>${n}回</td>
            <td>${last ? `${fmtD(last)} <span class="muted">(${daysBetween(last,today)}日前)</span>` : "-"}</td>
            <td><button class="btn small ghost" onclick="openCust('${u.id}')">詳細</button></td>
          </tr>`; }).join("")}
      </table>
    </div>
  `;
}
window.openCust = id => {
  const u = db.users.find(x => x.id === id);
  const visits = db.visits.filter(v => v.userId === id).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
  const ucs = db.userCoupons.filter(c => c.userId === id).slice(-5).reverse();
  modal(`<h3>👤 ${esc(u.name)} 様</h3>
    <table class="info-tbl">
      <tr><th>メール</th><td>${esc(u.email||"-")}</td></tr>
      <tr><th>電話</th><td>${esc(u.phone||"-")}</td></tr>
      <tr><th>生年月日</th><td>${esc(u.birth||"-")}　${esc(u.gender||"")}</td></tr>
      <tr><th>ポイント</th><td>${(u.points||0).toLocaleString()}pt ／ スタンプ ${u.stamps||0}/10</td></tr>
      <tr><th>紹介コード</th><td>${esc(u.refCode||"-")}</td></tr>
    </table>
    <div class="sec-title">来店履歴</div>
    ${visits.map(v => `<div class="list-item"><span>${fmtD(v.date)} ${esc(store(v.storeId).name.replace("焼肉 誠 ",""))}</span><span>${yen(v.amount)}</span></div>`).join("") || `<p class="muted">来店履歴なし</p>`}
    <div class="sec-title">保有クーポン</div>
    ${ucs.map(uc => `<div class="list-item"><span>${esc(coupon(uc.couponId).title)}</span><span class="tag ${uc.used?'':'green'}">${uc.used?"利用済":"未使用"}</span></div>`).join("") || `<p class="muted">クーポンなし</p>`}
    <div class="sec-title">来店を手動登録</div>
    <div class="grid2">
      <div><label>店舗</label><select id="mvStore">${db.stores.map(s => `<option value="${s.id}">${esc(s.name.replace("焼肉 誠 ",""))}</option>`).join("")}</select></div>
      <div><label>お会計金額</label><input id="mvAmount" type="number" step="100" placeholder="5000"></div>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="btn" style="flex:1" onclick="manualVisit('${id}')">来店を記録（pt・スタンプ付与）</button>
      <button class="btn ghost" onclick="closeModal()">閉じる</button>
    </div>`);
};
window.manualVisit = id => {
  const amount = Number($("#mvAmount").value);
  if(!amount || amount <= 0){ toast("お会計金額を入力してください"); return; }
  const result = recordVisit(id, $("#mvStore").value, todayStr(), "18:00", amount);
  closeModal();
  toast(result && result.stampCoupon ? "来店記録完了！スタンプ10個達成クーポンを発行しました" : "来店を記録しました");
  render();
};

/* ---------- クーポン管理 ---------- */
function aCoup(){
  const typeLabel = { auto_signup:"自動（初回登録）", auto_birthday:"自動（誕生日月）", auto_stamp:"自動（スタンプ達成）", auto_referral:"自動（紹介）", public:"アプリで配布" };
  return `
    <h2>クーポン管理</h2>
    <div class="card">
      <b style="font-size:13px;color:var(--gold2)">新しいクーポンを発行</b>
      <div class="grid2">
        <div><label>クーポン名</label><input id="cpTitle" placeholder="例：お久しぶりクーポン"></div>
        <div><label>特典内容</label><input id="cpBene" placeholder="例：お会計から10%OFF"></div>
      </div>
      <label>利用条件</label><input id="cpCond" placeholder="例：60日以上ご来店のないお客様限定">
      <div class="grid2">
        <div><label>有効期限（日数）</label><input id="cpDays" type="number" value="30"></div>
        <div><label>種別</label><select id="cpType">
          <option value="public">アプリで配布（お客様が取得）</option>
          <option value="target">ターゲット配信（下の配信を使用）</option>
        </select></div>
      </div>
      <div style="margin-top:14px"><button class="btn" onclick="saveCoupon()">クーポンを作成</button></div>
    </div>
    <div class="card">
      <b style="font-size:13px;color:var(--gold2)">ターゲット配信（プッシュ通知つき）</b>
      <p class="muted" style="margin-top:6px;line-height:1.7">閑散日対策・休眠顧客の掘り起こし・3店舗間の相互送客に使います。対象の顧客へクーポンを直接配布し、プッシュ通知を送信します。</p>
      <div class="grid2">
        <div><label>配布するクーポン</label><select id="dsCoupon">
          ${db.coupons.filter(c => c.active).map(c => `<option value="${c.id}">${esc(c.title)}（${esc(c.benefit)}）</option>`).join("")}</select></div>
        <div><label>配信対象</label><select id="dsTarget">
          <option value="all">全会員</option>
          <option value="inactive30">30日以上来店なし</option>
          <option value="inactive60">60日以上来店なし</option>
          <option value="birthday">今月誕生日の会員</option>
          ${db.stores.map(s => `<option value="fav_${s.id}">お気に入りが${esc(s.name.replace("焼肉 誠 ",""))}の会員</option>`).join("")}
          ${db.stores.map(s => `<option value="cross_${s.id}">${esc(s.name.replace("焼肉 誠 ",""))}以外がお気に入りの会員（相互送客）</option>`).join("")}
        </select></div>
      </div>
      <label>プッシュ通知メッセージ</label>
      <input id="dsMsg" placeholder="例：そろそろ焼肉はいかがですか？500円OFFクーポンをお届けしました！">
      <div style="margin-top:14px"><button class="btn" onclick="distCoupon()">この条件で配信する</button></div>
    </div>
    <div class="card tbl-wrap">
      <table class="tbl">
        <tr><th>クーポン名</th><th>特典</th><th>条件</th><th>種別</th><th>有効日数</th><th>発行数</th><th>利用数</th><th>状態</th><th></th></tr>
        ${db.coupons.map(c => {
          const issued = db.userCoupons.filter(uc => uc.couponId === c.id).length;
          const used = db.userCoupons.filter(uc => uc.couponId === c.id && uc.used).length;
          return `<tr>
            <td><b>${esc(c.title)}</b></td>
            <td>${esc(c.benefit)}</td>
            <td class="muted">${esc(c.cond)}</td>
            <td>${typeLabel[c.type] || "ターゲット配信"}</td>
            <td>${c.days}日</td>
            <td>${issued}枚</td>
            <td>${used}枚</td>
            <td><span class="tag ${c.active?'green':'red'}">${c.active?"有効":"停止中"}</span></td>
            <td><button class="btn small ghost" onclick="toggleCoupon('${c.id}')">${c.active?"停止":"再開"}</button></td>
          </tr>`; }).join("")}
      </table>
    </div>
  `;
}
window.saveCoupon = () => {
  const title = $("#cpTitle").value.trim(), bene = $("#cpBene").value.trim();
  if(!title || !bene){ toast("クーポン名と特典内容を入力してください"); return; }
  db.coupons.push({ id:uid("c"), title, benefit:bene, cond:$("#cpCond").value.trim(),
    type:$("#cpType").value, days:Number($("#cpDays").value) || 30, active:true });
  saveDB(); toast("クーポンを作成しました"); render();
};
window.toggleCoupon = id => { const c = coupon(id); c.active = !c.active; saveDB(); render(); };
window.distCoupon = () => {
  const cid = $("#dsCoupon").value, target = $("#dsTarget").value, msg = $("#dsMsg").value.trim();
  const today = todayStr(); const month = new Date().getMonth() + 1;
  let targets = db.users.filter(u => u.role === "customer");
  if(target === "inactive30" || target === "inactive60"){
    const th = target === "inactive30" ? 30 : 60;
    targets = targets.filter(u => { const last = lastVisitOf(u.id); return last && daysBetween(last, today) >= th; });
  }else if(target === "birthday"){
    targets = targets.filter(u => u.birth && Number(u.birth.slice(5,7)) === month);
  }else if(target.startsWith("fav_")){
    targets = targets.filter(u => u.favStore === target.slice(4));
  }else if(target.startsWith("cross_")){
    targets = targets.filter(u => u.favStore && u.favStore !== target.slice(6));
  }
  if(!targets.length){ toast("配信対象の会員がいません"); return; }
  targets.forEach(u => issueCoupon(u.id, cid));
  const c = coupon(cid);
  pushMsg(msg || `🎫 ${c.title}が届きました！`, `${c.benefit}／${c.cond}。クーポン画面をご確認ください。`);
  saveDB(); toast(`${targets.length}名にクーポンを配信しました（プッシュ通知送信済み）`); render();
};

      </div>
      <label>説明</label><input id="mnDesc" placeholder="例：数量限定の希少部位">

        <tr><th></th><th>メニュー名</th><th>カテゴリー</th><th>価格</th><th>おすすめ</th><th>人気順</th><th></th></tr>
        ${db.menus.map(m => `
          <tr>
            <td style="font-size:20px">${m.emoji}</td>

window.saveMenu = () => {

  db.menus.push({ id:uid("m"), cat:$("#mnCat").value, name, price,
    desc:$("#mnDesc").value.trim(), emoji:$("#mnEmoji").value || "🍖", rec:$("#mnRec").checked, pop:0 });
  saveDB(); toast("メニューを追加しました"); render();
};
window.delMenu = id => { db.menus = db.menus.filter(m => m.id !== id); saveDB(); toast("メニューを削除しました"); render(); };

/* ---------- お知らせ・キャンペーン ---------- */

    </div>
    <div class="card tbl-wrap">

        <tr><th>掲載日</th><th>種別</th><th>タイトル</th><th></th></tr>

          <tr>

            <td><b>${esc(n.title)}</b><div class="muted">${esc(n.body)}</div></td>

}
window.saveNews = () => {
  const title = $("#nwTitle").value.trim();
  if(!title){ toast("タイトルを入力してください"); return; }
  db.news.unshift({ id:uid("n"), kind:$("#nwKind").value, title, body:$("#nwBody").value.trim(), date:$("#nwDate").value || todayStr() });
  db.news.sort((a,b)=>b.date.localeCompare(a.date));
  saveDB(); toast("投稿しました"); render();
};
window.delNews = id => { db.news = db.news.filter(n => n.id !== id); saveDB(); toast("削除しました"); render(); };

/* ---------- プッシュ通知 ---------- */
function aPush(){
  return `
    <h2>プッシュ通知</h2>
    <p class="muted" style="margin-bottom:14px">全アプリ会員のスマートフォンに通知を送ります（プロトタイプ版ではアプリ内の🔔通知として届きます）。</p>

loadDB();

</script>
