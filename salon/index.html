<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>永瀬美容室 予約・顧客管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#463b31;
    --brown:#7c6250;
    --brown-dark:#5f4a3a;
    --gold:#a8845c;
    --gold-soft:#c9ae87;
    --bg:#f6f1e7;
    --card:#fffdf9;
    --muted:#a5988a;
    --line:#e7ddcc;
    --danger:#b3564e;
    --ok:#5b8a63;
    --serif:"Shippori Mincho","Yu Mincho","Hiragino Mincho ProN",serif;
    --radius:16px;
    --shadow:0 6px 24px rgba(120,95,70,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:var(--serif);
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(720px 420px at 88% -8%, rgba(214,190,160,.35), transparent 65%),
      radial-gradient(640px 460px at -10% 108%, rgba(196,170,138,.30), transparent 62%),
      linear-gradient(160deg,#f8f4ec 0%,#f4eee1 60%,#efe6d6 100%);
  }
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink);}
  svg.ic{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;}

  /* ===== 共通部品 ===== */
  .btn{
    display:inline-flex;align-items:center;gap:8px;justify-content:center;
    border:none;border-radius:10px;
    padding:12px 26px;font-size:14px;font-weight:600;letter-spacing:.12em;
    background:linear-gradient(135deg,#83654e,#a1815f);color:#fdf9f2;transition:.18s;
    box-shadow:0 3px 12px rgba(110,85,60,.25);
  }
  .btn:hover{background:linear-gradient(135deg,#6e5440,#8a6d4f);transform:translateY(-1px);}
  .btn.sub{background:#fffdf9;color:var(--brown);border:1px solid var(--gold-soft);box-shadow:none;}
  .btn.sub:hover{background:#f6efe3;transform:none;}
  .btn.danger{background:linear-gradient(135deg,#a3524a,#bc6f66);}
  .btn.danger:hover{background:linear-gradient(135deg,#8e4038,#a35a51);}
  .btn.small{padding:7px 14px;font-size:12px;border-radius:8px;letter-spacing:.08em;}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  .card{
    background:var(--card);border-radius:var(--radius);
    box-shadow:var(--shadow);border:1px solid rgba(231,221,204,.6);padding:24px;
  }
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);
    letter-spacing:.08em;margin-bottom:6px;}
  .field input,.field select,.field textarea{
    width:100%;padding:12px 13px;border:1px solid var(--line);
    border-radius:10px;background:#fff;outline:none;transition:.15s;
  }
  .field input:focus,.field select:focus,.field textarea:focus{
    border-color:var(--gold);box-shadow:0 0 0 3px rgba(168,132,92,.12);}
  .field input:disabled{background:#f4efe6;color:var(--muted);}
  .badge{display:inline-block;padding:3px 12px;border-radius:999px;font-size:11px;
    font-weight:600;letter-spacing:.06em;}
  .badge.active{background:#e9f1e9;color:var(--ok);}
  .badge.cancelled{background:#f6e7e5;color:var(--danger);}
  .badge.done{background:#efe8db;color:var(--brown-dark);}
  .badge.admin{background:#f2e8d2;color:#8d6f31;}
  .muted{color:var(--muted);font-size:13px;}
  .empty{
    text-align:center;color:var(--muted);padding:46px 10px;letter-spacing:.05em;
    border:1px dashed var(--gold-soft);border-radius:var(--radius);background:rgba(255,253,249,.5);
  }

  /* ページ見出し（透かし文字付き） */
  .page-head{position:relative;margin-bottom:24px;padding-top:14px;}
  .page-head .watermark{
    position:absolute;top:-14px;left:-6px;z-index:0;pointer-events:none;user-select:none;
    font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:500;
    font-size:64px;line-height:1;color:rgba(160,128,88,.13);letter-spacing:.04em;
  }
  h2.page-title{position:relative;font-size:26px;letter-spacing:.14em;font-weight:600;}
  p.page-sub{position:relative;color:var(--muted);font-size:13px;letter-spacing:.06em;margin-top:8px;}

  /* ===== ログイン画面 ===== */
  #login-screen{
    min-height:100vh;display:none;align-items:center;justify-content:center;padding:20px;
  }
  #login-screen.on{display:flex;}
  .login-box{
    width:100%;max-width:420px;background:rgba(255,253,249,.92);
    border:1px solid rgba(201,174,135,.4);
    border-radius:22px;box-shadow:0 18px 60px rgba(110,85,60,.18);
    padding:44px 38px;backdrop-filter:blur(6px);
  }
  .login-logo{text-align:center;margin-bottom:30px;}
  .login-logo .mark{
    width:72px;height:72px;margin:0 auto 14px;border-radius:50%;
    border:1.5px solid var(--gold);color:var(--gold);font-size:28px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 0 0 3px #fffdf9, inset 0 0 0 4.5px rgba(168,132,92,.35);
  }
  .login-logo h1{font-size:24px;letter-spacing:.3em;text-indent:.3em;font-weight:600;}
  .login-logo .en{
    color:var(--gold);font-size:10px;letter-spacing:.42em;text-indent:.42em;
    margin-top:6px;font-family:"Cormorant Garamond",serif;font-style:italic;
  }
  .login-logo p.sys{color:var(--muted);font-size:12px;letter-spacing:.2em;margin-top:10px;}
  .login-error{
    display:none;background:#f6e7e5;color:var(--danger);
    font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:14px;
  }
  .login-hint{
    margin-top:22px;padding:14px;border-radius:10px;border:1px dashed var(--gold-soft);
    background:rgba(246,241,231,.7);font-size:12px;color:var(--muted);line-height:1.9;letter-spacing:.04em;
  }

  /* ===== アプリ本体レイアウト ===== */
  #app{display:none;}
  header.appbar{
    background:rgba(255,253,249,.88);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:0 26px;height:74px;
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:20;
  }
  .appbar .brand{display:flex;align-items:center;gap:14px;}
  .appbar .brand .mark{
    width:46px;height:46px;border-radius:50%;flex:none;
    border:1.3px solid var(--gold);color:var(--gold);font-size:19px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 0 0 2.5px #fffdf9, inset 0 0 0 3.8px rgba(168,132,92,.35);
  }
  .appbar .brand .tx b{display:block;font-size:19px;letter-spacing:.22em;font-weight:600;}
  .appbar .brand .tx span{
    display:block;color:var(--gold);font-size:9px;letter-spacing:.34em;margin-top:2px;
    font-family:"Cormorant Garamond",serif;
  }
  .appbar .userinfo{display:flex;align-items:center;gap:16px;font-size:13px;letter-spacing:.08em;}
  nav.tabs{
    background:rgba(255,253,249,.85);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    display:flex;gap:10px;padding:0 20px;overflow-x:auto;
    position:sticky;top:74px;z-index:19;
  }
  nav.tabs button{
    background:none;border:none;padding:17px 18px;font-size:14px;font-weight:600;
    letter-spacing:.12em;color:var(--muted);border-bottom:2px solid transparent;
    white-space:nowrap;display:flex;align-items:center;gap:8px;transition:.15s;
  }
  nav.tabs button:hover{color:var(--brown);}
  nav.tabs button.on{color:var(--brown-dark);border-bottom-color:var(--gold);}
  main.content{max-width:1080px;margin:0 auto;padding:34px 22px 70px;}
  .view{display:none;}
  .view.on{display:block;}

  /* ===== 予約ウィザード：矢印型ステップバー ===== */
  .steps{display:flex;margin:6px 0 34px;filter:drop-shadow(0 2px 8px rgba(120,95,70,.10));}
  .steps .st{
    flex:1;display:flex;align-items:center;justify-content:center;gap:10px;
    font-size:13px;font-weight:600;letter-spacing:.14em;color:#a99b89;
    padding:15px 10px 15px 26px;background:#f4eddf;position:relative;
    clip-path:polygon(0 0, calc(100% - 17px) 0, 100% 50%, calc(100% - 17px) 100%, 0 100%, 17px 50%);
    margin-left:-9px;
  }
  .steps .st:first-child{
    clip-path:polygon(0 0, calc(100% - 17px) 0, 100% 50%, calc(100% - 17px) 100%, 0 100%);
    border-radius:999px 0 0 999px;margin-left:0;padding-left:18px;
  }
  .steps .st:last-child{
    clip-path:polygon(0 0, 100% 0, 100% 100%, 0 100%, 17px 50%);
    border-radius:0 999px 999px 0;
  }
  .steps .st .stn{
    width:26px;height:26px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;background:#fff;color:#a99b89;border:1px solid #ddd0bb;
  }
  .steps .st.on{
    background:linear-gradient(135deg,#7b5f4a,#96775a);color:#fdf9f2;
  }
  .steps .st.on .stn{background:#fdf9f2;color:var(--brown-dark);border-color:transparent;}
  .steps .st.donez{background:#dfd2bd;color:#6f5b47;}
  .steps .st.donez .stn{background:rgba(255,255,255,.75);color:#6f5b47;border-color:transparent;}
  @media(max-width:640px){
    .steps .st{font-size:0;gap:0;}       /* スマホでは番号のみ */
    .steps .st .stn{font-size:12px;}
  }

  .choice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;}
  .choice{
    border:1px solid var(--line);border-radius:18px;padding:20px;background:var(--card);
    cursor:pointer;transition:.18s;box-shadow:var(--shadow);position:relative;
  }
  .choice:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(120,95,70,.16);}
  .choice.sel{border-color:var(--gold);background:#fbf6ec;
    box-shadow:0 0 0 2px rgba(168,132,92,.35), var(--shadow);}
  .choice .nm{font-weight:600;font-size:17px;letter-spacing:.12em;margin-bottom:5px;}
  .choice .ds{font-size:12px;color:var(--muted);line-height:1.8;letter-spacing:.04em;}

  /* スタイリストカード（写真つき） */
  .choice.stylist{text-align:center;padding:30px 20px 26px;}
  .choice.stylist .face,
  .choice.stylist .face-fb{
    width:116px;height:116px;border-radius:50%;object-fit:cover;margin:0 auto 16px;
    box-shadow:0 0 0 4px #fffdf9, 0 0 0 5.5px rgba(201,174,135,.55), 0 6px 18px rgba(120,95,70,.18);
    display:block;
  }
  .choice.stylist .face-fb{
    display:none;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#eadfca,#dfcfb2);
    color:#8a6d4f;font-size:38px;font-weight:600;
  }
  .cbadge{
    position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;
    background:#f4ecdc;color:var(--gold);display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(201,174,135,.4);
  }
  .cbadge svg{width:17px;height:17px;}

  .wiz-nav{display:flex;justify-content:space-between;margin-top:30px;}

  /* ===== カレンダー ===== */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .cal-head .ym{font-weight:600;font-size:17px;letter-spacing:.14em;}
  table.cal{width:100%;border-collapse:collapse;table-layout:fixed;}
  table.cal th{font-size:11px;color:var(--muted);padding:7px 0;font-weight:600;letter-spacing:.1em;}
  table.cal th.sun{color:#bd7a74;}
  table.cal th.sat{color:#7e93ad;}
  table.cal td{
    height:54px;text-align:center;vertical-align:middle;border:1px solid #efe7d7;
    font-size:14px;background:#fffdf9;transition:.12s;
  }
  table.cal td.pick{cursor:pointer;}
  table.cal td.pick:hover{background:#f4ecdc;}
  table.cal td.sel{background:linear-gradient(135deg,#7b5f4a,#96775a);color:#fdf9f2;font-weight:600;}
  table.cal td.off{background:#f3eee3;color:#cec2ad;}
  table.cal td .cnt{display:block;font-size:10px;color:var(--gold);font-weight:600;}
  table.cal td.sel .cnt{color:#f2e2c4;}
  .slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:9px;margin-top:16px;}
  .slot{
    border:1px solid var(--line);border-radius:9px;padding:10px 0;text-align:center;
    font-size:14px;font-weight:600;letter-spacing:.06em;background:#fffdf9;cursor:pointer;transition:.12s;
  }
  .slot:hover{border-color:var(--gold-soft);background:#faf5ea;}
  .slot.sel{background:linear-gradient(135deg,#7b5f4a,#96775a);border-color:transparent;color:#fdf9f2;}
  .slot.ng{background:#f3eee3;color:#cec2ad;cursor:not-allowed;}

  /* ===== 一覧・テーブル ===== */
  .list-item{
    background:var(--card);border-radius:14px;box-shadow:var(--shadow);
    border:1px solid rgba(231,221,204,.6);
    padding:18px 20px;margin-bottom:13px;
    display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center;
  }
  .list-item .info{flex:1;min-width:230px;}
  .list-item .info .ttl{font-weight:600;letter-spacing:.06em;margin-bottom:4px;}
  .list-item .info .sb{font-size:13px;color:var(--muted);line-height:1.8;letter-spacing:.03em;}
  .list-item .acts{display:flex;gap:8px;flex-wrap:wrap;}
  table.plain{
    width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;
    overflow:hidden;box-shadow:var(--shadow);border:1px solid rgba(231,221,204,.6);
  }
  table.plain th{
    background:#efe7d5;font-size:12px;padding:12px 14px;text-align:left;
    color:var(--brown-dark);letter-spacing:.1em;font-weight:600;
  }
  table.plain td{padding:12px 14px;border-top:1px solid #f0e8d8;font-size:14px;vertical-align:middle;}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px;}
  .toolbar input[type=text],.toolbar input[type=date],.toolbar select{
    padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:#fffdf9;outline:none;
  }
  .toolbar input:focus,.toolbar select:focus{border-color:var(--gold);}

  /* ===== モーダル ===== */
  .modal-bg{
    display:none;position:fixed;inset:0;background:rgba(60,45,32,.5);backdrop-filter:blur(3px);
    z-index:50;align-items:center;justify-content:center;padding:18px;
  }
  .modal-bg.on{display:flex;}
  .modal{
    background:var(--card);border-radius:18px;max-width:540px;width:100%;
    max-height:88vh;overflow-y:auto;padding:30px;
    border:1px solid rgba(201,174,135,.35);
    box-shadow:0 18px 60px rgba(50,36,24,.4);
  }
  .modal h3{margin-bottom:18px;font-size:18px;letter-spacing:.14em;font-weight:600;}
  .modal .m-acts{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}

  /* ===== トースト ===== */
  #toast{
    position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(80px);
    background:#5f4a3a;color:#fdf9f2;padding:13px 26px;border-radius:999px;
    font-size:14px;letter-spacing:.08em;box-shadow:0 8px 30px rgba(60,45,30,.35);
    opacity:0;transition:.3s;z-index:99;pointer-events:none;white-space:nowrap;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast.err{background:var(--danger);}

  /* ===== ダッシュボード ===== */
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:24px;}
  .stat{
    background:var(--card);border-radius:14px;box-shadow:var(--shadow);
    border:1px solid rgba(231,221,204,.6);padding:18px;
  }
  .stat .lb{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.14em;}
  .stat .vl{font-size:28px;font-weight:600;color:var(--brown-dark);margin-top:4px;}
  .stat .vl small{font-size:13px;font-weight:600;color:var(--muted);}

  h3.sec{font-size:16px;letter-spacing:.14em;font-weight:600;}

  @media(max-width:600px){
    .login-box{padding:34px 24px;}
    header.appbar{padding:0 16px;height:64px;}
    nav.tabs{top:64px;}
    main.content{padding:22px 14px 60px;}
    table.cal td{height:46px;font-size:13px;}
    .page-head .watermark{font-size:46px;}
    h2.page-title{font-size:21px;}
  }
</style>
</head>
<body>

<!-- ================= ログイン画面 ================= -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <div class="mark">✂</div>
      <h1>永瀬美容室</h1>
      <div class="en">NAGASE BEAUTY SALON</div>
      <p class="sys">予約・顧客管理システム</p>
    </div>
    <div class="login-error" id="login-error">IDまたはパスワードが違います</div>
    <form id="login-form" autocomplete="off">
      <div class="field">
        <label>会員ID</label>
        <input type="text" id="login-id" placeholder="例）000" required>
      </div>
      <div class="field">
        <label>パスワード</label>
        <input type="password" id="login-pw" placeholder="パスワード" required>
      </div>
      <button type="submit" class="btn" style="width:100%;margin-top:8px;">ログイン</button>
    </form>
    <div class="login-hint">
      【テスト用アカウント】<br>
      管理者：ID <b>123</b> ／ パスワード <b>123</b><br>
      お客様：ID <b>000</b> ／ パスワード <b>000</b>
    </div>
  </div>
</div>

<!-- ================= アプリ本体 ================= -->
<div id="app">
  <header class="appbar">
    <div class="brand">
      <span class="mark">✂</span>
      <span class="tx"><b>永瀬美容室</b><span>NAGASE BEAUTY SALON</span></span>
    </div>
    <div class="userinfo">
      <span id="user-label"></span>
      <button class="btn sub small" onclick="logout()">ログアウト</button>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main class="content" id="views"></main>
</div>

<!-- モーダル -->
<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal-body"></div>
</div>

<div id="toast"></div>

<script>
"use strict";
/* =====================================================
   永瀬美容室 予約・顧客管理アプリ（PHP + MySQL版）
   - データはサーバー側の MySQL に保存
   - api/ 以下のPHPとJSON形式のfetch通信で連携
   ===================================================== */

const API_BASE = "api/";

const state = {
  user: null,       // ログイン中ユーザー
  menus: [],        // 施術メニュー（マスタ）
  stylists: []      // スタイリスト（マスタ）
};
let currentTab = null;

/* ---------- アイコン（インラインSVG） ---------- */
const IC = {
  calendar: '<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>',
  doc:      '<svg class="ic" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>',
  clock:    '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
  person:   '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>',
  people:   '<svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1.2-3.4 4-5 6.5-5s5.3 1.6 6.5 5"/><circle cx="17" cy="9" r="2.8"/><path d="M15.5 15.2c2.6.2 4.9 1.7 6 4.8"/></svg>',
  grid:     '<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="10" width="8" height="11" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/></svg>',
  scissors: '<svg class="ic" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.6"/><circle cx="6" cy="18" r="2.6"/><path d="M8.2 7.6 20 19M8.2 16.4 20 5"/></svg>',
  crown:    '<svg class="ic" viewBox="0 0 24 24"><path d="M3 17 4.5 7l4.8 4L12 5l2.7 6 4.8-4L21 17z"/><path d="M4.5 20h15"/></svg>',

/* ---------- API通信ヘルパー ---------- */
async function api(path, { method = "GET", data = null } = {}) {
  const opt = { method, credentials: "same-origin", headers: {} };
  if (data !== null) {
    opt.headers["Content-Type"] = "application/json";
    opt.body = JSON.stringify(data);
  }
  let res;
  try {
    res = await fetch(API_BASE + path, opt);
  } catch (e) {
    throw new Error("サーバーに接続できません（Apacheが起動しているか確認してください）");
  }
  let json = null;
  try { json = await res.json(); } catch (e) { /* JSONでない応答 */ }
  if (!res.ok) {
    if (res.status === 401 && state.user) { showLogin(); }  // セッション切れ
    throw new Error(json && json.error ? json.error : "通信エラーが発生しました (" + res.status + ")");
  }
  return json;
}

/* ---------- ユーティリティ ---------- */
const $  = sel => document.querySelector(sel);
const $$ = sel => document.querySelectorAll(sel);
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function pad2(n){ return String(n).padStart(2,"0"); }
function fmtDate(d){ return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); }
function todayStr(){ return fmtDate(new Date()); }
function jpDate(iso){
  if(!iso) return "";
  const [y,m,d] = iso.split("-").map(Number);
  const w = "日月火水木金土"[new Date(y, m-1, d).getDay()];
  return `${y}年${m}月${d}日(${w})`;
}
function yen(n){ return "¥" + Number(n||0).toLocaleString(); }
function toast(msg, isErr){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.toggle("err", !!isErr);
  t.classList.add("show");
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.classList.remove("show"), 2600);
}
function statusBadge(st){
  return st === "active"    ? '<span class="badge active">予約中</span>'
       : st === "cancelled" ? '<span class="badge cancelled">キャンセル</span>'
       :                      '<span class="badge done">来店済み</span>';
}
function getMenu(id){ return state.menus.find(m => m.id == id); }
function getStylist(id){ return state.stylists.find(s => s.id == id); }
const CLOSED_WEEKDAY = 2; // 火曜定休（表示用。判定の本体はサーバー側）
function isClosedDay(dateObj){ return dateObj.getDay() === CLOSED_WEEKDAY; }

async function switchTab(key){
  currentTab = key;
  $$("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === key));
  $$(".view").forEach(v => v.classList.toggle("on", v.id === "view-" + key));
  const t = tabsFor().find(t => t.key === key);
  if (t) {
    const el = $("#view-" + key);
    try { await t.render(el); }
    catch (err) { el.innerHTML = `<div class="empty">${esc(err.message)}</div>`; }
  }
  window.scrollTo(0,0);
}

/* =====================================================
   月間カレンダー描画（共通部品）
   ===================================================== */
function calendarHTML(opts){
  const { year, month } = opts;
  const first = new Date(year, month, 1);
  const last  = new Date(year, month+1, 0);
  let html = `
    <div class="cal-head">
      <button class="btn sub small" onclick="${opts.navId}(-1)">◀ 前月</button>
      <span class="ym">${year}年 ${month+1}月</span>
      <button class="btn sub small" onclick="${opts.navId}(1)">翌月 ▶</button>
    </div>
    <table class="cal"><tr>
      <th class="sun">日</th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th class="sat">土</th>
    </tr><tr>`;
  for(let i=0;i<first.getDay();i++) html += "<td class='off'></td>";
  for(let d=1; d<=last.getDate(); d++){
    const dt = new Date(year, month, d);
    const iso = fmtDate(dt);
    const wd = dt.getDay();
    if(wd === 0 && d !== 1) html += "</tr><tr>";
    const tooOld = opts.minDate && iso < opts.minDate;
    const closed = isClosedDay(dt);
    const cnt = opts.countOf ? opts.countOf(iso) : 0;
    const cntHtml = cnt > 0 ? `<span class="cnt">${cnt}件</span>` : "";
    if(tooOld || closed){
      html += `<td class="off">${d}${closed ? "<span class='cnt' style='color:#cec2ad'>定休</span>" : ""}</td>`;
    }else{
      const sel = opts.selDate === iso ? " sel" : "";
      html += `<td class="pick${sel}" onclick="${opts.onPick}('${iso}')">${d}${cntHtml}</td>`;
    }
  }
  const lastWd = last.getDay();
  for(let i=lastWd;i<6;i++) html += "<td class='off'></td>";
  html += "</tr></table>";
  return html;
}

/* =====================================================
   【管理者】予約管理
   ===================================================== */
const adm = { calY:null, calM:null, selDate:null, filter:"active" };
let adminResvCache = [];

async function renderAdminReservations(el){
  if(adm.calY === null){
    const n = new Date();
    adm.calY = n.getFullYear(); adm.calM = n.getMonth(); adm.selDate = todayStr();
  }
  const q = adm.filter === "all" ? "" : `&status=${adm.filter}`;
  const [countsRes, listRes] = await Promise.all([
    api(`reservations.php?action=counts&year=${adm.calY}&month=${adm.calM+1}`),
    api(`reservations.php?action=list&date=${adm.selDate}${q}`)
  ]);
  adminResvCache = listRes.reservations;
  const countOf = iso => countsRes.counts[iso] || 0;

  el.innerHTML = pageHead("Reservation", "予約管理", "カレンダーの日付を選ぶと、その日の予約が表示されます。数字はその日の予約件数です。") + `
    <div class="card" style="padding:18px;margin-bottom:20px;">
      ${calendarHTML({ year:adm.calY, month:adm.calM, selDate:adm.selDate, onPick:"admPickDate", navId:"admCalNav", countOf })}
    </div>
    <div class="toolbar">
      <b style="letter-spacing:.08em;">${jpDate(adm.selDate)}</b>
      <select onchange="admSetFilter(this.value)">
        <option value="active" ${adm.filter==="active"?"selected":""}>予約中のみ</option>
        <option value="all" ${adm.filter==="all"?"selected":""}>すべて表示</option>
        <option value="done" ${adm.filter==="done"?"selected":""}>来店済みのみ</option>
        <option value="cancelled" ${adm.filter==="cancelled"?"selected":""}>キャンセルのみ</option>
      </select>
    </div>
    ${adminResvCache.length ? adminResvCache.map(r => adminResvItem(r)).join("") : `<div class="empty">該当する予約はありません。</div>`}
  `;
}
function admCalNav(d){
  adm.calM += d;
  if(adm.calM < 0){ adm.calM = 11; adm.calY--; }
  if(adm.calM > 11){ adm.calM = 0; adm.calY++; }
  refresh();
}
function admPickDate(iso){ adm.selDate = iso; refresh(); }
function admSetFilter(v){ adm.filter = v; refresh(); }

function adminResvItem(r){
  return `
  <div class="list-item">
    <div class="info">
      <div class="ttl">${r.time}〜　${esc(r.user_name)} 様 ${statusBadge(r.status)}</div>
      <div class="sb">${jpDate(r.date)} ／ 担当：${esc(r.stylist_name)} ／ ${esc(r.menu_name)}（約${r.minutes}分 / ${yen(r.price)}）
      ${r.user_phone ? `<br>TEL：${esc(r.user_phone)}` : ""}</div>
    </div>
    <div class="acts">
      ${r.status === "active" ? `
        <button class="btn small" onclick="openDoneResv(${r.id})">来店済みにする</button>
        <button class="btn danger small" onclick="confirmCancelResv(${r.id})">キャンセル</button>` : ""}
    </div>
  </div>`;
}

    <h3>${s ? "スタイリストの編集" : "スタイリストの追加"}</h3>
    <div class="field"><label>氏名</label><input id="sf-name" value="${esc(s ? s.name : "")}"></div>
    <div class="field"><label>肩書き</label><input id="sf-title" value="${esc(s ? s.title : "スタイリスト")}"></div>
    <div class="m-acts">
      <button class="btn sub" onclick="closeModal()">戻る</button>
      <button class="btn" onclick="saveStylist(${s ? s.id : "null"})">保存</button>
    </div>`);
}
async function saveStylist(id){
  try {
    await api("master.php", { method:"POST", data:{
      action: "save_stylist", id,
      name: $("#sf-name").value.trim(),
      title: $("#sf-title").value.trim()
    }});
    closeModal();
    toast("スタイリストを保存しました");
    refresh();
  } catch (err) { toast(err.message, true); }
}
async function deleteStylist(id){
  try {
    await api("master.php", { method:"POST", data:{ action:"delete_stylist", id } });
    toast("スタイリストを削除しました");
    refresh();
  } catch (err) { toast(err.message, true); }
}
</script>
</body>
</html>
